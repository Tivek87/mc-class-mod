modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# Adds an arm pose (Green Lantern raising his lantern) to the game's own list; see that file.
enumExtensions="META-INF/enumextensions.json"
description='''
${mod_description}
'''

# Two small hooks into the game (see nl.tivek.welcomescreen.mixin): the creatures the ring's scan marked glow
# through walls for its maker, in the colour of what they are to him.
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
