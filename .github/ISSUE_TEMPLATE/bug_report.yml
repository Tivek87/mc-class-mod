name: Bug report
description: Something in the mod does not work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Mod version
      description: The jar name tells you, e.g. multiverse-powers-0.0.1-alpha.jar
      placeholder: 0.0.1-alpha
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Singleplayer
        - Multiplayer (server)
    validations:
      required: true
  - type: input
    id: character
    attributes:
      label: Character, class or spell
      placeholder: Green Lantern, Giant Fist (R)
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      placeholder: |
        1. Pick Green Lantern
        2. Hold R
        3. ...
  - type: textarea
    id: log
    attributes:
      label: Crash report or log
      description: Paste the relevant part of logs/latest.log or the crash report. Remove anything personal first.
      render: text
