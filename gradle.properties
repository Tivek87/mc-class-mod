# Gradle instellingen
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment (leesbare parameternamen in Minecraft code)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.250
loader_version_range=[1,)

# Mod properties
# mod_id blijft welcomescreen: daaraan hangen items in bestaande werelden, de config-map en de toetsen.
mod_id=welcomescreen
mod_name=Multiverse Powers
# Naam van de jar (multiverse-powers-<versie>.jar), gelijk aan de naam van de mod.
mod_file_name=multiverse-powers
mod_license=All Rights Reserved
# Raised by scripts/release.ps1, one step per release: 0.0.1 .. 0.0.9, 0.1.0 .. 9.9.9 (every digit 0-9).
mod_version=0.0.5-alpha
mod_group_id=nl.tivek.multiversepowers
mod_authors=Tivek
mod_description=Adds RPG classes, spells, a Vanilla+ stamina system, and characters from across the multiverse to turn into.
